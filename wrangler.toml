name = "preoink-secure-playtest"
main = "src/index.js"
compatibility_date = "2026-11-01"

# This must be the ONLY game-serving origin. Do not use public Pages assets.
[[r2_buckets]]
binding = "GAME_FILES"
bucket_name = "preoink-private-game"

[[d1_databases]]
binding = "DB"
database_name = "preoink-auth"
# REQUIRED: replace with the real D1 UUID from wrangler d1 create preoink-auth.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
